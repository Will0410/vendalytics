# ── Banco operacional ────────────────────────────────────────────────────────
#
# Existe por um motivo específico: o disco do plano free do Render é EFÊMERO.
# Com o banco em SQLite no disco do serviço, TODO deploy apagava a tabela de
# usuários — o admin era recriado com senha aleatória impressa uma única vez no
# log, e quem estava dentro perdia o acesso na publicação seguinte. Já tinha
# acontecido antes neste projeto (ver o comentário em config.py sobre o disco
# efêmero).
#
# `infra/db.py` já suportava Postgres, com uma lista de migrations própria
# (AUTOINCREMENT → GENERATED ALWAYS AS IDENTITY) e um wrapper que traduz os
# placeholders `?` para `%s`. Faltava só provisionar o banco e apontar a
# variável — é o que estas duas declarações fazem.
databases:
  - name: vendalytics-db
    plan: free
    databaseName: vendalytics
    user: vendalytics

services:
  - type: web
    name: vendalytics
    env: python
    plan: free
    healthCheckPath: /api/health

    # O build faz duas coisas: dependências Python e o bundle da interface
    # React. O `|| echo` no fim é deliberado — se a imagem do Render não tiver
    # Node, o build do front falha mas o deploy CONTINUA, e o FastAPI serve o
    # `web/dist` que está versionado no repositório. Sem esse fallback, uma
    # ausência de Node derrubaria o serviço inteiro em vez de publicar a
    # interface da última vez que alguém rodou `npm run build`.
    # Cada caminho imprime uma linha própria no log: sem isso, descobrir se o
    # front foi reconstruído no Render ou se veio do `web/dist` versionado
    # exige adivinhar pelo hash do arquivo servido.
    buildCommand: >-
      pip install -r requirements.txt &&
      ( cd web &&
        if command -v npm >/dev/null 2>&1; then
          echo "[front] npm $(npm -v) / node $(node -v) — reconstruindo" &&
          npm ci --no-audit --no-fund && npm run build &&
          echo "[front] OK: bundle reconstruído no Render";
        else
          echo "[front] Node ausente na imagem — publicando o web/dist versionado";
        fi
      ) || echo "[front] FALHOU o build — publicando o web/dist versionado"

    startCommand: cd backend && uvicorn vendalytics.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8

      # Sem esta variável o banco volta a ser SQLite no disco efêmero, e os
      # usuários somem no próximo deploy. O Render preenche sozinho a partir
      # do banco declarado acima — nenhum valor de conexão entra no repositório.
      - key: DATABASE_URL
        fromDatabase:
          name: vendalytics-db
          property: connectionString

      - key: JWT_SECRET
        generateValue: true
      - key: VENDALYTICS_ADAPTER
        value: sqlite_reference
      - key: DEMO_MODE
        value: true

      # Chave da Groq — alimenta o painel "Leitura do analista de IA".
      # `sync: false` significa: o Render pede o valor no painel e NUNCA o
      # grava neste arquivo. Credencial paga não entra em repositório.
      # Sem ela o app funciona igual; só o painel de IA diz que está
      # indisponível, e a análise determinística continua completa.
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
