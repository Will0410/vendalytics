services:
  - type: web
    name: vendalytics
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && uvicorn vendalytics.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: JWT_SECRET
        generateValue: true
      - key: VENDALYTICS_ADAPTER
        value: sqlite_reference
      - key: DEMO_MODE
        value: true
