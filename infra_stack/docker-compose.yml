networks:
  vendalytics-net:
    driver: bridge

volumes:
  postgres_data:
  clickhouse_data:
  kafka_data:
  mlflow_data:

services:
  # ── Barramento de sinais (spec §3.6) ────────────────────────────────────
  # Kafka em modo KRaft — sem Zookeeper. É o ponto de troca já documentado
  # em infra/reactor.py e infra/scores.py::emitir_sinal: hoje o barramento
  # é uma tabela SQLite consultada sob demanda; subir isto valida que o
  # transporte real existe e sobe, não que o código Python já publica nele
  # (essa troca fica em `emitir_sinal`, sem mudar as regras de negócio).
  kafka:
    image: apache/kafka:3.7.0
    container_name: vendalytics-kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: "vendalytics-dev-cluster-000001"
    volumes: ["kafka_data:/var/lib/kafka/data"]
    networks: [vendalytics-net]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ── Banco transacional + geoespacial (spec §3.4) ────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    container_name: vendalytics-postgres
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: vendalytics
      POSTGRES_PASSWORD: vendalytics_dev_only
      POSTGRES_DB: vendalytics
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    networks: [vendalytics-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vendalytics"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Analítico de alto volume (menções, sinais, séries) — spec §3.4 ──────
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: vendalytics-clickhouse
    ports: ["8123:8123", "9000:9000"]
    environment:
      CLICKHOUSE_USER: vendalytics
      CLICKHOUSE_PASSWORD: vendalytics_dev_only
      CLICKHOUSE_DB: vendalytics
    volumes: ["clickhouse_data:/var/lib/clickhouse"]
    networks: [vendalytics-net]
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Feature store online (spec §3.2 Feast) ──────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: vendalytics-redis
    ports: ["6379:6379"]
    networks: [vendalytics-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── MLOps: tracking/registry de modelo (spec §3.3) ──────────────────────
  # Sem imagem oficial de um-comando; Dockerfile de 4 linhas ao lado é o
  # suficiente para validar que sobe e responde — não é uma instalação
  # de produção (falta backend store em Postgres, autenticação, etc.).
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: vendalytics-mlflow
    # 5050 no host, não 5000: no Windows a porta 5000 costuma estar
    # reservada pelo próprio SO (validado nesta sessão — bind falhava com
    # "acesso... proibido pelas permissões", não é conflito de outro app).
    # O container continua ouvindo 5000 por dentro.
    ports: ["5050:5000"]
    volumes: ["mlflow_data:/mlflow"]
    networks: [vendalytics-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Orquestração de pipeline (spec §3.1 Dagster) ────────────────────────
  dagster:
    build:
      context: .
      dockerfile: Dockerfile.dagster
    container_name: vendalytics-dagster
    ports: ["3001:3000"]
    networks: [vendalytics-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
